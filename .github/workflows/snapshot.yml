name: Daily lane closures snapshot

on:
  schedule:
    # 06:30 UTC = ~1:30-2:30am America/New_York, safely after local midnight
    # so the snapshot date matches the day the workflow runs.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend package
        run: pip install -e ./backend

      - name: Save raw snapshot
        run: python jobs/save_raw_snapshot.py

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily lane closures snapshot"
          git push
