[project]
name = "penn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "clickhouse-connect>=0.7",
  "h3>=4.0",
  "openai>=1.30",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Embedded ClickHouse for tests/test_tools_sql.py. Linux and macOS only; the test skips without it.
sqltest = ["chdb; sys_platform != 'win32'"]
# scripts/fetch_visitphilly.py reads a saved page offline in the installed Chrome; no browser download needed.
pages = ["playwright>=1.45"]
# deploy/data_bucket.py: weekly data to and from the S3 data bucket.
bucket = ["boto3>=1.34"]

[tool.setuptools.packages.find]
include = ["penn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
